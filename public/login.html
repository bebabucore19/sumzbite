<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin | Sumzbite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-visual">
      <a class="brand" href="index.html"><img src="img/logo.png" alt="Logo Sumzbite" class="brand-logo"><span>Sumzbite</span></a>
      <h1>Admin Panel Sumzbite</h1>
      <p>Login terlebih dahulu untuk melihat hasil transaksi, mengelola produk, dan mencetak laporan pembelian.</p>
      <a class="btn ghost" href="index.html">← Kembali ke Website</a>
    </section>

    <section class="login-card">
      <span class="badge green">Login Admin</span>
      <h2>Masuk Dashboard</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input class="form-control" type="text" id="username" placeholder="Masukkan username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Masukkan password" required />
        </div>
        <button class="btn primary full-btn" type="submit">Login</button>
        <div class="alert" id="loginAlert"></div>
      </form>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
